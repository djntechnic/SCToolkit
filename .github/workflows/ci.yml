name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Build before test: the bootstrap smoke test loads dist/ and would
      # otherwise be asserting against the previously committed bundle.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # dist/ is the @updateURL target. If a fresh build differs from what was
      # committed, users would be auto-updated to stale code.
      - name: Verify dist/ is not stale
        run: node scripts/verify-dist.js
